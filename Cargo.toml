[workspace]
members = ["products/apfsmount"]
resolver = "3"

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.95"
license = "AGPL-3.0-or-later"
repository = "https://github.com/poeggi/apfsmount"
publish = false

[workspace.dependencies]
anyhow = "1.0.104"
# The APFS reader of apfs-explorer (GPL-3.0-only), not on crates.io.
apfs-core = { git = "https://github.com/enesilhaydin/apfs-explorer", tag = "v1.3.0" }
# The HFS+ reader from our fork of dpp: catalog::list_directory_records (Dil4rd/dpp#22).
cmpfs = { git = "https://github.com/poeggi/dpp", rev = "2eab051f419a03aa76bdbc0ea5a1dbc4df57d1b7" }
hfsplus = { git = "https://github.com/poeggi/dpp", rev = "2eab051f419a03aa76bdbc0ea5a1dbc4df57d1b7" }
log = "0.4.35"
unicode-normalization = "0.1.26"
# The shared code, from the ufsmount repo. installer/*.iss are copies of the same tag.
win-mountkit = { git = "https://github.com/poeggi/ufsmount", tag = "v0.5.4" }
winresource = "0.1.34"

[profile.release]
lto = "thin"
